name = "mathematics-with-lean"
defaultTargets = ["Slides"]

# Mathlib comes first so that its versions of shared dependencies win
# and the prebuilt Mathlib cache applies.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0-rc1"

# A local clone of verso-slides `main` (2d8e2cc) with a fix for let-bound hypotheses in the info
# panel (branch `panel-let-fallback`). To go back to upstream, use
#   git = "https://github.com/leanprover/verso-slides.git"
#   rev = "main"
[[require]]
name = "verso-slides"
path = "../../downstream/mathematics-with-lean/verso-slides"

[[lean_lib]]
name = "Slides"

# No `lean_exe` for `Main`: linking it would compile all of Mathlib natively.
# Render with `lake env lean --run Main.lean` instead.

# Worked examples for the talk. They are not a default target.
# Build them with `lake build Examples`.
[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]
